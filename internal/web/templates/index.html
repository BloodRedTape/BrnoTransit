{{define "content"}}
<header class="brand">
  <img class="brand-icon" src="{{asset "icons/icon-192.png"}}" alt="" width="28" height="28">
  <h1>Brno Transit</h1>
</header>

<form class="card search" action="/search" method="get" autocomplete="off">
  {{if .Error}}<p class="form-error" role="alert">{{.Error}}</p>{{end}}
  <div class="field">
    <span class="dot dot-hollow" aria-hidden="true"></span>
    <label class="sr-only" for="from">From</label>
    <input id="from" name="from" class="stop-input" placeholder="From" value="{{.From}}" required role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="from-list">
    <ul class="suggest" id="from-list" role="listbox" hidden></ul>
    <button type="button" class="swap" id="swap" aria-label="Swap From and To">{{template "icon-swap"}}</button>
  </div>
  <div class="field">
    <span class="dot dot-filled" aria-hidden="true"></span>
    <label class="sr-only" for="to">To</label>
    <input id="to" name="to" class="stop-input" placeholder="To" value="{{.To}}" required role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="to-list">
    <ul class="suggest" id="to-list" role="listbox" hidden></ul>
  </div>
  <button type="submit" class="btn-primary">{{template "icon-search"}}<span>Search connections</span></button>
  <script id="stops-data" type="application/json">{{.Stops}}</script>
</form>
{{end}}
